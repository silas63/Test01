<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Taschenrechner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #24104f,
                    #090014 60%,
                    #020006
                );

            color: white;
        }

        .calculator {
            width: 360px;
            max-width: 94vw;

            padding: 20px;

            background: rgba(10, 5, 25, 0.9);

            border: 2px solid #00ffff;
            border-radius: 20px;

            box-shadow:
                0 0 15px #00ffff,
                0 0 40px rgba(0, 255, 255, 0.3);
        }

        h1 {
            text-align: center;

            color: #00ffff;

            font-size: 28px;

            text-shadow:
                0 0 10px #00ffff,
                0 0 20px #ff00ff;
        }

        .display {
            width: 100%;
            height: 100px;

            margin-bottom: 15px;
            padding: 15px;

            border-radius: 12px;

            background: #05000d;

            border: 1px solid #ff00ff;

            box-shadow:
                inset 0 0 15px rgba(255, 0, 255, 0.3);

            text-align: right;

            overflow: hidden;
        }

        #expression {
            height: 30px;

            color: #aaa;

            font-size: 16px;
        }

        #result {
            font-size: 34px;
            color: #00ffff;

            text-shadow: 0 0 10px #00ffff;

            white-space: nowrap;
        }

        .buttons {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;
        }

        button {
            height: 60px;

            border: none;
            border-radius: 12px;

            background: #160020;

            color: white;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;

            border: 1px solid #333;

            transition:
                transform 0.1s,
                box-shadow 0.2s,
                background 0.2s;
        }

        button:hover {
            transform: scale(1.04);

            background: #250038;

            box-shadow:
                0 0 10px #ff00ff;
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            color: #ff00ff;

            border-color: #ff00ff;

            text-shadow: 0 0 8px #ff00ff;
        }

        .equals {
            color: #00ffff;

            border-color: #00ffff;

            text-shadow: 0 0 8px #00ffff;

            background: #002a2a;
        }

        .clear {
            color: #ff3366;

            border-color: #ff3366;
        }

        .zero {
            grid-column: span 2;
        }

        .history {
            margin-top: 20px;

            border-top: 1px solid #333;

            padding-top: 15px;
        }

        .history-title {
            display: flex;

            justify-content: space-between;
            align-items: center;

            color: #00ffff;
        }

        #history {
            max-height: 130px;

            overflow-y: auto;

            margin-top: 10px;

            font-size: 14px;
            color: #aaa;
        }

        .history-item {
            padding: 7px;

            border-bottom: 1px solid #222;
        }

        .history-item:hover {
            color: #00ffff;
        }

        #clearHistory {
            height: auto;

            padding: 6px 10px;

            font-size: 12px;

            color: #ff3366;
        }
    </style>
</head>
